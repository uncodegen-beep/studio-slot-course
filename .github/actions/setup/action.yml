name: Setup project
description: Node.js с кэшем npm и установка зависимостей (общий шаг для всех job'ов)

runs:
    using: composite
    steps:
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
              node-version: 24
              cache: npm

        - name: Install dependencies
          shell: bash
          run: npm ci
          env:
              # Git-хуки в CI не нужны: проверки идут отдельными шагами
              HUSKY: '0'
