name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Workflow только читает репозиторий — минимальные права токена
permissions:
    contents: read

jobs:
    quality:
        name: Typecheck & Lint
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup

            - name: Typecheck
              run: npm run typecheck

            - name: Check formatting (Prettier)
              run: npm run format:check

            - name: Lint
              run: npm run lint

    test:
        name: Unit tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup

            - name: Unit tests with coverage
              run: npm run test:ci

    build:
        name: Build application
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup

            - name: Build (production)
              run: npm run build:prod
