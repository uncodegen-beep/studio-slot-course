<ul class="list">
    <!-- track studio.id: по ключу Angular узнаёт студию после обновления массива -->
    @for (studio of studios(); track studio.id; let i = $index, even = $even) {
        <li [class.even]="even">
            <ng-container
                [ngTemplateOutlet]="itemTemplate() ?? defaultItem"
                [ngTemplateOutletContext]="{ $implicit: studio, index: i }"
            />
        </li>
    } @empty {
        <!-- @empty выводится, когда массив пуст: отдельный @if не нужен -->
        <li class="empty">Студий не найдено. Попробуйте изменить фильтры.</li>
    }
</ul>

<ng-template
    #defaultItem
    let-studio
    let-i="index"
>
    {{ i + 1 }}. {{ studio.name }}
</ng-template>
