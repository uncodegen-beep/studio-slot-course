<!-- Классы состояния — на самом теге <app-studio-card> через host в декораторе -->
<article class="card">
    <img
        class="card__cover"
        [src]="studio.coverUrl"
        [alt]="studio.name"
    />

    <div class="card__body">
        <h3 class="card__title">{{ studio.name }}</h3>
        <p class="card__meta">{{ studio.city }} · от {{ studio.pricePerHour }} ₽/час</p>

        <!-- ?? 0 — rating необязательный, а строгий TS не даёт умножать undefined -->
        <div
            class="card__rating"
            role="img"
            [attr.aria-label]="'Рейтинг ' + studio.rating + ' из 5'"
        >
            <div
                class="card__rating-bar"
                [style.width.%]="(studio.rating ?? 0) * 20"
            ></div>
        </div>

        <div class="card__actions">
            <button
                type="button"
                [disabled]="!studio.isOpen"
            >
                Забронировать
            </button>
            <button
                type="button"
                [attr.aria-label]="favorite"
                (click)="toggleFavorite()"
            >
                <app-icon [name]="favorite ? 'heart-filled' : 'heart'" />
            </button>
        </div>
    </div>
</article>
