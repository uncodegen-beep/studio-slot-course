<!-- Пока resolver грузит данные, старая страница остаётся на экране — показываем, что переход идёт -->
@if (navigating()) {
    <div
        class="progress"
        role="progressbar"
        aria-label="Загрузка страницы"
    ></div>
}

@if (!online()) {
    <p
        class="offline"
        role="alert"
    >
        Нет соединения с интернетом. Данные могут быть устаревшими.
    </p>
}

<app-header />

<main class="content">
    <router-outlet />
</main>

<app-footer />

<app-toast />
