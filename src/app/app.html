<app-header />

<main>
    <input
        #query
        type="search"
        placeholder="Поиск студии"
        aria-label="Поиск студии"
        (keyup.enter)="search(query.value)"
    />

    <app-studio-card />

    <h2>Студии</h2>
    <app-studio-list [studios]="studios" />

    <h2>Компактно: свой шаблон элемента</h2>
    <app-studio-list
        [studios]="studios"
        [itemTemplate]="compactItem"
    />

    <ng-template
        #compactItem
        let-studio
    >
        <strong>{{ studio.name }}</strong> · {{ studio.city }}, от {{ studio.pricePerHour }} ₽/час
    </ng-template>

    <router-outlet />
</main>
