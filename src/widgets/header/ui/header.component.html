<header class="header">
    <!-- Логотип ведёт на главную. routerLink — та же <a href>: работает «открыть в новой вкладке» -->
    <a
        class="logo"
        routerLink="/"
    >
        {{ appName }}
    </a>

    <nav
        class="nav"
        aria-label="Основная навигация"
    >
        <!-- routerLinkActive — класс у ссылки текущей страницы, aria-current — для скринридера -->
        <a
            routerLink="/studios"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
        >
            Студии
        </a>
        <a
            routerLink="/account"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
        >
            Кабинет
        </a>
        @if (session.role() === "owner") {
            <a
                routerLink="/owner"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
            >
                Владельцу
            </a>
        }
    </nav>

    <div class="meta">
        <!-- Тот же стор, что и в каталоге: счётчик меняется вместе с карточками -->
        <span class="favorites">Избранное: {{ favoritesStore.favorites().size }}</span>
        <app-clock />
        @if (session.user(); as user) {
            <span class="user">{{ user.name }}</span>
            <button
                type="button"
                class="sign-out"
                (click)="signOut()"
            >
                Выйти
            </button>
        } @else {
            <a
                class="sign-in"
                routerLink="/login"
            >
                Войти
            </a>
        }
    </div>
</header>
