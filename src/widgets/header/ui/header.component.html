<header class="header">
    <a
        class="logo"
        routerLink="/"
    >
        {{ appName }}
    </a>

    <nav
        class="nav"
        aria-label="Основная навигация"
    >
        <!-- routerLinkActive — класс у ссылки текущей страницы, aria-current — для скринридера -->
        <a
            routerLink="/studios"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
        >
            Студии
        </a>
        <a
            routerLink="/bookings"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
        >
            Мои бронирования
        </a>
    </nav>

    <app-clock />
</header>
