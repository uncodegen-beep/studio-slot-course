<header class="header">
    <a
        class="logo"
        routerLink="/"
    >
        {{ appName }}
    </a>

    <nav
        class="nav"
        aria-label="Основная навигация"
    >
        <!-- routerLinkActive — класс у ссылки текущей страницы, aria-current — для скринридера -->
        <a
            routerLink="/studios"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
        >
            Студии
        </a>
        <a
            routerLink="/bookings"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
        >
            Мои бронирования
        </a>
    </nav>

    <div class="meta">
        <!-- Тот же стор, что и в каталоге: счётчик меняется вместе с карточками -->
        <span class="favorites">Избранное: {{ favoritesStore.favorites().size }}</span>
        <app-clock />
    </div>
</header>
